# rabbithole relay (Cloudflare Worker): aircraft feeds (no CORS), ships (AISStream) and
# webcams (Windy) for the page. Keys are secrets, never in git:
#   hosted:       npx wrangler secret put AISSTREAM_KEY   /   npx wrangler secret put WINDY_KEY
#   self-hosted:  worker/.dev.vars (written by `npm run setup`), used by `npm run selfhost`
# Values in worker/.dev.vars also override the [vars] below when running locally, e.g.
#   SHIPS_MAX_SPAN_DEG=40  (bigger ship views for your own relay)   WEBCAM_CACHE_S=300
name = "rabbithole-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Pages allowed to use this relay (comma-separated): local dev/preview and the published site.
# If you deploy your own copy, put your own site's address here (scheme + host, no path).
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173,https://rafaildd.github.io"
SHIPS_MAX_SPAN_DEG = "20"
WEBCAM_CACHE_S = "600"

[[durable_objects.bindings]]
name = "SHIPS"
class_name = "ShipsRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShipsRelay"]
